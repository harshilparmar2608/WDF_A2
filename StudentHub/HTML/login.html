<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Hub - Login</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

    <div id="main_box">Student Hub Portal</div>

    <div id="adjust">
        <div id="login_container">
            <form action="index.html" method="get">
                
                <div class="form_row">
                    <span class="label_text">Role:</span>
                    <select class="input_box" name="role">
                        <option value="student">Student</option>
                        <option value="faculty">Faculty</option>
                    </select>
                </div>

                <div class="form_row">
                    <span class="label_text">Student ID:</span>
                    <input type="text" class="input_box" required placeholder="e.g. 23DCE001">
                </div>

                <div class="form_row">
                    <span class="label_text">Password:</span>
                    <input type="password" class="input_box" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn">Sign In</button>
            </form>
        </div>
    </div>

    <div class="fot">Student Hub • Portal Access</div>

</body>
</html>
